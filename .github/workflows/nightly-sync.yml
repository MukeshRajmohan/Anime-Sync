name: Nightly AniList Sync

on:
  schedule:
    # Runs at 05:00 UTC (12:00 AM EST)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub interface

jobs:
  sync-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install notion-client python-dotenv playwright requests
          
      - name: Install Playwright & System Dependencies
        run: playwright install chromium --with-deps

      - name: Install Virtual Display (Xvfb)
        run: sudo apt-get install -y xvfb

      - name: Execute Sync Script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" python sync.py
